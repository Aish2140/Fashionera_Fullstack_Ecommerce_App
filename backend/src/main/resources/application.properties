spring.application.name=backend
# ?? Server ????????????????????????????????????????????????????????????????
server.port=8080
# ?? MySQL Database ?????????????????????????????????????????????????????????
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ?? Connection Pool (HikariCP ? built into Spring Boot) ?????????????????
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
# ?? JWT ????????????????????????????????????????????????????????????????????
# NEVER commit real secrets to Git. Use environment variables in production.
jwt.secret=${JWT_SECRET:mySecretKey1234567890abcdefghijklmnopqrstuvwxyz1234567890AB}
jwt.expiration=86400000
# ?? Logging ????????????????????????????????????????????????????????????????
logging.level.com.ecommerce=DEBUG
logging.level.org.springframework.security=DEBUG
# ?? Spring Boot 3.5.x: enable virtual threads (optional performance boost) ?
# spring.threads.virtual.enabled=true

